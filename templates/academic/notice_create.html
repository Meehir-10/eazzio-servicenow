{% extends 'base.html' %}
{% block title %}Post Notice - CampusSphere AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0 text-dark">
                    <i class="fa-solid fa-bullhorn text-primary me-2"></i> Broadcast Notice / Circular
                </h5>
                <a href="{% url 'notice_list' %}" class="btn btn-sm btn-outline-secondary rounded-pill">Cancel</a>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Notice Title / Subject Line</label>
                        {{ form.title }}
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Target Audience</label>
                            {{ form.target_role }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Priority Level</label>
                            {{ form.priority }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Notice Detailed Body</label>
                        {{ form.content }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Upload Circular / PDF / Order</label>
                        {{ form.attachment }}
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm">
                        <i class="fa-solid fa-paper-plane me-2"></i> Publish Notice & Broadcast Notification
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
