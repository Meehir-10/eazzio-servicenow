{% extends 'base.html' %}
{% block public_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none">
                <i class="fa-solid fa-graduation-cap text-primary fa-3x mb-2"></i>
                <h3 class="fw-bold text-dark">CampusSphere <span class="badge bg-primary">AI</span></h3>
            </a>
            <p class="text-muted small">Sign in to your college ERP portal</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} small alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                        <input type="text" name="username" id="id_username" class="form-control border-start-0" placeholder="Username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold small text-secondary mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="id_password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Register here</a>
            </div>

            <!-- Quick Demo Fill Buttons -->
            <div class="mt-4 pt-3 border-top">
                <p class="text-center text-muted small fw-semibold mb-2">Quick Demo Fill</p>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-2" onclick="fillCreds('rohit_kumar', 'student123')">Student</button>
                    <button type="button" class="btn btn-sm btn-outline-warning text-dark rounded-pill px-2" onclick="fillCreds('prof_sharma', 'teacher123')">Faculty</button>
                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-2" onclick="fillCreds('admin', 'admin123')">Admin</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('id_username').value = u;
        document.getElementById('id_password').value = p;
    }
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.has('u')) document.getElementById('id_username').value = params.get('u');
        if (params.has('p')) document.getElementById('id_password').value = params.get('p');
    });
</script>
{% endblock %}
