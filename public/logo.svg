<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="15" y="15" width="170" height="170" rx="38" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

  <!-- AI Constellation Lines -->
  <g stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.5">
    <line x1="45" y1="65" x2="100" y2="40" />
    <line x1="100" y1="40" x2="155" y2="65" />
    <line x1="155" y1="65" x2="140" y2="135" />
    <line x1="140" y1="135" x2="100" y2="155" />
    <line x1="100" y1="155" x2="60" y2="135" />
    <line x1="60" y1="135" x2="45" y2="65" />
  </g>

  <!-- Constellation Nodes -->
  <circle cx="45" cy="65" r="3" fill="#60a5fa" />
  <circle cx="100" cy="40" r="3.5" fill="#93c5fd" />
  <circle cx="155" cy="65" r="3" fill="#60a5fa" />
  <circle cx="140" cy="135" r="3" fill="#60a5fa" />
  <circle cx="100" cy="155" r="3.5" fill="#93c5fd" />
  <circle cx="60" cy="135" r="3" fill="#60a5fa" />

  <!-- Modern Graduation Mortarboard / Cap -->
  <path d="M 100 58 L 155 82 L 100 106 L 45 82 Z" fill="url(#capGrad)" filter="url(#glow)"/>
  <path d="M 68 95 L 68 122 C 68 135 132 135 132 122 L 132 95 L 100 109 Z" fill="#2563eb" opacity="0.95"/>

  <!-- AI Brain / Digital Microchip Center Core -->
  <circle cx="100" cy="82" r="7" fill="#ffffff" />
  <circle cx="100" cy="82" r="4" fill="#1e3a8a" />

  <!-- Tassel & AI Sparkle -->
  <path d="M 145 86 C 145 102 140 115 142 125" stroke="url(#accentGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="142,125 140,136 144,136" fill="url(#accentGrad)"/>

  <!-- AI Sparkles -->
  <path d="M 152 48 Q 152 56 160 56 Q 152 56 152 64 Q 152 56 144 56 Q 152 56 152 48 Z" fill="#fde047" filter="url(#glow)"/>
  <path d="M 50 115 Q 50 120 55 120 Q 50 120 50 125 Q 50 120 45 120 Q 50 120 50 115 Z" fill="#93c5fd"/>
</svg>
